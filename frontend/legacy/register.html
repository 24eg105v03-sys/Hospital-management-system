<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CarePulse HMS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center;">
          <div class="brand-icon"><i class="fa-solid fa-hospital"></i></div>
          CarePulse HMS
        </a>
        <h2>Create an Account</h2>
        <p>Join the healthcare management portal</p>
      </div>

      <form id="registerForm">
        <div class="form-grid-2">
          <div class="form-group">
            <label for="reg_fullname">Full Name</label>
            <input type="text" id="reg_fullname" class="form-control" placeholder="Jane Doe" required>
          </div>
          <div class="form-group">
            <label for="reg_username">Username</label>
            <input type="text" id="reg_username" class="form-control" placeholder="janedoe" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg_email">Email Address</label>
          <input type="email" id="reg_email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="reg_password">Password</label>
            <input type="password" id="reg_password" class="form-control" placeholder="At least 6 chars" required minlength="6">
          </div>
          <div class="form-group">
            <label for="reg_role">Account Role</label>
            <select id="reg_role" class="form-control" required>
              <option value="PATIENT" selected>Patient</option>
              <option value="DOCTOR">Doctor</option>
              <option value="RECEPTIONIST">Staff / Receptionist</option>
              <option value="ADMIN">Administrator</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          <i class="fa-solid fa-user-plus"></i> Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign In</a>
      </div>
      <div style="text-align: center; margin-top: 0.75rem;">
        <a href="index.html" style="font-size: 0.8rem; color: var(--text-light);">← Back to Homepage</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/login.js"></script>
</body>
</html>
